<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loot Wars</title>
<style>
  :root { --ink:#141414; --muted:#5d6470; --page:#f4f6f1; --card:#ffffff; --edge:#dfe4d6; --accent:#00A67A; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f1f2ee; --muted:#a7adb6; --page:#14161a; --card:#1d2026; --edge:#2c3038; --accent:#2fd3a0; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 56px; }
  .card { background:var(--card); border:1px solid var(--edge); border-radius:16px; padding: 28px 24px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 28px 0 6px; }
  p { margin: 0 0 10px; }
  .date { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  nav { margin-bottom: 18px; font-size: 14px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Loot Wars</h1>
    <p class="date">A game for iPhone.</p>
    <p><a href="privacy.html">Privacy Policy</a></p>
    <p><a href="terms.html">Terms of Use</a></p>
    <p>Contact: <a href="mailto:mistydual@gmail.com">mistydual@gmail.com</a></p>
  </div>
</main>
</body>
</html>
